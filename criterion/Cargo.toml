[package]
name = "jpeg-encoder-bench"
version = "0.0.0"
authors = ["Volker Ströbel <volkerstroebel@mysurdity.de>"]
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace]
members = ["."]

[features]
simd = ["jpeg-encoder/simd"]

[dependencies]
jpeg-encoder = {path = "..", features = ["benchmark"]}

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"]}
bytemuck = "1.25.0"
imgref = "1.12.1"
rgb = "0.8.53"
image = "0.25.10"

[profile.dev]
opt-level = 1

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "fdct"
harness = false

[[bench]]
name = "ycbcr"
harness = false

[[bench]]
name = "basic"
harness = false

[[bench]]
name = "quantize"
harness = false

[[bench]]
name = "huffman"
harness = false

[[bench]]
name = "misc"
harness = false

[[bench]]
name = "encode_variants"
harness = false